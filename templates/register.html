{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Register Student</h2>
  <form method="post">
    <div class="row">
      <input type="text" name="reg_no" placeholder="Registration Number" required>
      <input type="text" name="name" placeholder="Full Name" required>
      <select name="gender" required>
        <option value="">Gender</option>
        <option value="M">Male</option>
        <option value="F">Female</option>
      </select>
      <input type="text" name="dept" placeholder="Department" value="CSE" required>
      <input type="number" name="year" min="1" max="5" value="1" required>
      <select name="sleep">
        <option value="1">Early Bird</option>
        <option value="2" selected>Moderate</option>
        <option value="3">Night Owl</option>
      </select>
      <input type="number" name="cleanliness" min="1" max="5" value="3" required>
      <input type="number" name="noise" min="1" max="5" value="3" required>
      <select name="study">
        <option value="1" selected>Silent</option>
        <option value="2">Moderate</option>
        <option value="3">Music</option>
      </select>
      <select name="diet">
        <option value="1">Veg</option>
        <option value="2">Non-Veg</option>
        <option value="3" selected>Any</option>
      </select>
    </div>
    <div style="margin-top: 12px;"><button type="submit">Register & Show Matches</button></div>
  </form>
</div>
{% endblock %}
