<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoomMatch UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; color: #1d2433; }
    nav { background: #16213e; padding: 12px 24px; }
    nav a { color: white; text-decoration: none; margin-right: 16px; font-weight: 600; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 16px 32px; }
    .card { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e7e9ef; font-size: 14px; }
    th { background: #f1f4ff; }
    .muted { color: #6f7482; font-size: 13px; }
    .flash { padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .flash.success { background: #e7f9ed; color: #166534; }
    .flash.error { background: #fdecec; color: #991b1b; }
    input, select, button { padding: 8px; border-radius: 8px; border: 1px solid #ced3df; }
    button { background: #2f4df6; color: white; border: none; cursor: pointer; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  </style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">Students</a>
  <a href="{{ url_for('register') }}">Register</a>
  <a href="{{ url_for('rooms') }}">Room Assignment</a>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
